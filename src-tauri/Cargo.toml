[package]
name = "photopea-offline"
version = "1.0.0"
edition = "2021"
description = "Self-contained offline Photopea (personal use)"

[dependencies]
# custom-protocol = Tauri's production mode (what `tauri build` turns on); without it Tauri treats the build as
# development and embeds the project folder path in the program
tauri = { version = "2", features = ["custom-protocol"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
